<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="旅行手帐"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="leaflet.css"><script src="leaflet.js"></script><title>新西兰旅行手帐</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f5f5f7">
<style>
/* Layout: quiet product-page look. Frosted top nav on desktop, frosted tab bar on phone; one centered 980px column of soft white tiles on pale grey. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunk:#f0f0f2; --line:#e3e3e8; --hair:rgba(0,0,0,.08);
  --ink:#1d1d1f; --muted:#6e6e73; --faint:#86868b;
  --fern:#0071e3; --fern-ink:#ffffff; --fern-soft:#e8f1fc; --link:#0066cc;
  --glacier:#0071e3; --sea:#dfe9f3; --land:#fbfbfd; --land-line:#c9d3dc;
  --ember:#bf4800; --danger:#e30000; --ok:#1a9a55; --mkb:#1d1d1f; --mkb-ink:#ffffff;
  --glass:rgba(251,251,253,.78); --scrim:rgba(0,0,0,.32);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; --ease:cubic-bezier(.25,.1,.25,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#161617; --sunk:#232325; --line:#2e2e31; --hair:rgba(255,255,255,.1);
  --ink:#f5f5f7; --muted:#a1a1a6; --faint:#86868b;
  --fern:#2997ff; --fern-ink:#ffffff; --fern-soft:#0f2a45; --link:#2997ff;
  --glacier:#2997ff; --sea:#0d1a26; --land:#1f1f21; --land-line:#3a3a3d;
  --ember:#ff9f0a; --danger:#ff453a; --ok:#30d158; --mkb:#f5f5f7; --mkb-ink:#1d1d1f;
  --glass:rgba(22,22,23,.78); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#161617; --sunk:#232325; --line:#2e2e31; --hair:rgba(255,255,255,.1);
  --ink:#f5f5f7; --muted:#a1a1a6; --faint:#86868b;
  --fern:#2997ff; --fern-ink:#ffffff; --fern-soft:#0f2a45; --link:#2997ff;
  --glacier:#2997ff; --sea:#0d1a26; --land:#1f1f21; --land-line:#3a3a3d;
  --ember:#ff9f0a; --danger:#ff453a; --ok:#30d158; --mkb:#f5f5f7; --mkb-ink:#1d1d1f;
  --glass:rgba(22,22,23,.78); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--fern);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--glass)}

/* top nav (desktop) */
.app{min-height:100%}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:52px;display:flex;align-items:center;gap:2px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair);padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
nav.side>*{flex:none}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:18px}
.brand svg{width:20px;height:20px;color:var(--ink)}
.navbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:980px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;transition:color .2s var(--ease),background .2s var(--ease)}
nav.side .navbtn svg{display:none}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--sunk)}
.side .spacer{flex:1}
.sync{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;padding:0 6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--ember)}
nav.side [data-act="settings"] svg{display:block;width:17px;height:17px}

main{min-width:0;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-block:44px 80px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* type */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:8px}
header.top>div:first-child{min-width:0;flex:1 1 auto}
header.top .acts-top{display:flex;gap:8px;align-items:center;flex:none}
h1{font-family:var(--display);font-size:48px;line-height:1.08;letter-spacing:-.03em;margin:2px 0 0;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0;font-weight:700}
h3{font-size:17px;line-height:1.35;margin:0;font-weight:600;letter-spacing:-.015em}
header.top .sub{font-size:17px;color:var(--muted);margin-top:8px;line-height:1.45}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--faint);font-size:15px;padding:6px 0}

/* controls */
.btn{border:0;background:var(--sunk);color:var(--ink);border-radius:980px;height:36px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .2s var(--ease),opacity .2s var(--ease),transform .2s var(--ease)}
.btn:hover{text-decoration:none;filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--fern);color:var(--fern-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--link)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn svg{width:15px;height:15px}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--link);padding:0;transition:background .2s var(--ease)}
.iconbtn:hover{background:var(--sunk);text-decoration:none}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--surface);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.banner{background:var(--surface);border-radius:var(--r);padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.banner .btn{background:none;color:var(--link);padding:0;height:auto}
.pill{display:inline-flex;align-items:center;font-size:12px;line-height:20px;padding:0 9px;border-radius:980px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.code{font-family:var(--mono);font-size:13px;line-height:20px;background:var(--sunk);color:var(--ink);padding:0 8px;border-radius:6px;cursor:pointer;border:0;display:inline-block}
.code:hover{background:var(--fern-soft);color:var(--fern)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:980px;height:34px;padding:0 15px;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;flex:none;transition:background .2s var(--ease),color .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip i{width:8px;height:8px;border-radius:50%;display:block}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:28px 30px}
.hero .eyebrow{color:var(--muted);font-weight:500}
.hero .nb{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em;margin-top:4px;line-height:1.25}
.count{font-family:var(--display);font-size:64px;line-height:1;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
.countwrap{text-align:right}
.countwrap .sub{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.stat{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);display:block;margin-top:4px}

/* days */
.day{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.dayhead{display:flex;gap:14px;align-items:center;padding:20px 24px 14px}
.daynum{font-family:var(--display);font-weight:600;font-size:15px;line-height:1;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffffff;flex:none}
.dayhead .grow{flex:1;min-width:0}
.dayhead h3{font-size:19px;letter-spacing:-.02em}
.daytheme{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:14px;text-align:left;display:block}
.daytheme:hover{color:var(--link)}
.daytheme.add{color:var(--link)}
.items{list-style:none;margin:0;padding:0 0 4px}
.it{display:grid;grid-template-columns:52px 24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 16px 12px 24px;cursor:pointer;line-height:1.45;transition:background .15s var(--ease)}
.it+.it{box-shadow:inset 0 1px 0 var(--line);box-shadow:none;border-top:1px solid var(--line);margin-left:24px;padding-left:0;grid-template-columns:52px 24px minmax(0,1fr) auto}
.it:hover{background:var(--sunk)}
.it.static{cursor:default}.it.static:hover{background:none}
.it .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;line-height:24px}
.it .ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--muted)}
.it .ic svg{width:14px;height:14px}
.it .ic.booked{background:var(--fern-soft);color:var(--fern)}
.it .ic.ht{color:var(--fern)}
.it .main{min-width:0}
.it .name{font-weight:600;overflow-wrap:anywhere;line-height:24px;font-size:16px;letter-spacing:-.015em}
.it .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere;line-height:1.55}
.it .meta .code{margin-left:2px}
.it.done .name{text-decoration:line-through;color:var(--faint)}
.it .acts{display:flex;gap:0;margin-top:-5px}
.night{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--line);margin-top:4px}
.night svg{width:15px;height:15px;color:var(--ember)}
.dayfoot{display:flex;gap:8px;padding:6px 20px 20px;flex-wrap:wrap;align-items:center}

/* bookings */
.bk-list{display:flex;flex-direction:column;gap:14px}
.bk{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:start}
.bk .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--fern-soft);color:var(--fern)}
.bk .ic svg{width:22px;height:22px}
.bk h3{font-size:19px;letter-spacing:-.02em}
.bk .when{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink);margin-top:2px}
.bk .acts{display:flex;flex-direction:column;gap:2px;margin:-4px -8px 0 0}

/* map */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sea);height:min(64vh,600px);touch-action:none;user-select:none;box-shadow:var(--shadow)}
.mapbox svg{width:100%;height:100%;cursor:grab}
.mapbox svg.drag{cursor:grabbing}
.mapctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.mapctl button{width:40px;height:40px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.mapctl button+button{border-top:1px solid var(--hair)}
.mapctl button:hover{background:var(--sunk)}
.mapctl svg{width:17px;height:17px}
.maplegend{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:6px 12px;border-radius:980px}
.land{fill:var(--land);stroke:var(--land-line);vector-effect:non-scaling-stroke;stroke-width:1}
.route{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.mk{cursor:pointer}
.mk circle,.mk rect{stroke:var(--land);vector-effect:non-scaling-stroke;stroke-width:2}
.mklabel{fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;font-family:var(--body);font-weight:600;pointer-events:none}
.mk text.n.b{fill:var(--mkb-ink)}
.mk text.n{fill:#ffffff;stroke:none;font-weight:600;font-family:var(--display);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.pinfo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.pinfo .eyebrow{color:var(--muted);font-weight:500;font-size:13px}
.plist{display:flex;flex-direction:column}
.plist button.p{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;line-height:1.4;font-size:15px}
.plist button.p:first-child{border-top:0}
.plist button.p:hover span:nth-child(2){color:var(--link)}
.plist .bub{width:24px;height:24px;border-radius:50%;color:#ffffff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--display)}

/* budget */
.big{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1;color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 110px;gap:14px;align-items:center;font-size:14px}
.bar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--fern);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:18px}
.meter div{height:100%;background:var(--fern);border-radius:99px}
.meter div.over{background:var(--danger)}
.xlist{list-style:none;margin:0;padding:0}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.xrow:first-child,.xday+.xrow{border-top:0}
.xrow:hover .tt{color:var(--link)}
.xrow .tt{font-weight:500;overflow-wrap:anywhere}
.xrow .mm{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.xrow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.xrow .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.xday{font-size:13px;font-weight:600;color:var(--muted);padding:18px 0 2px}
.xlist .xday:first-child{padding-top:6px}

/* packing */
.pk-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.pk label{display:flex;gap:12px;align-items:center;padding:9px 0;cursor:pointer;border-top:1px solid var(--line)}
.pk h3+span+label,.pk .row+label{border-top:0}
.pk label input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);margin:0;flex:none;display:grid;place-items:center;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease)}
.pk label input:checked{background:var(--fern);border-color:var(--fern)}
.pk label input:checked::after{content:"";width:6px;height:11px;border:solid #ffffff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pk label.on span{text-decoration:line-through;color:var(--faint)}
.pk label span{flex:1;min-width:0;overflow-wrap:anywhere}
.pk .x{opacity:0;color:var(--faint);font-size:18px;transition:opacity .2s var(--ease)}
.pk label:hover .x{opacity:1}
.pk .row{margin-bottom:6px}
.pkadd{display:flex;gap:10px;flex-wrap:nowrap;align-items:center}
.pkadd input{flex:1 1 100px;min-width:0;border:0;background:var(--sunk);border-radius:12px;height:40px;padding:0 14px}
.pkadd select{border:0;background:var(--sunk);border-radius:12px;height:40px;padding:0 10px;flex:none}
.pkadd .btn{height:40px}

/* info */
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.info-grid .card .eyebrow{color:var(--muted);font-weight:500}
.info-grid .card p{margin:8px 0 0;font-size:15px}
.info-grid ul{margin:10px 0 0;padding-left:18px;font-size:15px;color:var(--ink)}
.info-grid li+li{margin-top:6px}
.info-grid h3{font-size:19px}
#cv-nzd{border:0;background:var(--sunk);border-radius:12px;height:40px;padding:0 12px;width:110px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s var(--ease)}
.sheet{background:var(--surface);border-radius:22px;width:min(580px,100%);max-height:calc(100% - 24px);overflow:auto;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .28s var(--ease)}
.sheet h2{font-size:24px}
.sheet .iconbtn{color:var(--muted);background:var(--sunk);width:30px;height:30px;font-size:18px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid transparent;background:var(--sunk);border-radius:12px;height:44px;padding:0 14px;width:100%;min-width:0;transition:border-color .2s var(--ease),background .2s var(--ease)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--fern);background:var(--surface)}
.f textarea{min-height:84px;padding:10px 14px;resize:vertical;height:auto}
.f .money{display:flex;gap:8px}
.f .money input{flex:1 1 auto;width:auto}
.f .money select{flex:none;width:auto}
.f .check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink);font-weight:400;cursor:pointer}
.f .check input{width:20px;height:20px;accent-color:var(--fern);padding:0}
.geo{display:flex;gap:8px;align-items:center}
.geo input{flex:1}
.hint{font-size:12px;color:var(--muted)}
.hint.err{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:980px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.2);animation:rise .25s var(--ease)}
nav.bottom{display:none}
.mobile-only{display:none!important}
@media (max-width:820px){
  nav.side{display:none}
  body::before{background:var(--bg)}

/* ---------- state + storage ---------- */
const DEFAULT_META = {name:"新西兰自驾", start:"", end:"", rate:0.77, budget:0, budgetCur:"SGD"};
const CACHE_KEY = "nztrip-cache-v1";
const cached = lsGet(CACHE_KEY);
const S = {
  meta: Object.assign({}, DEFAULT_META, cached?.meta || {}),
  bookings: cached?.bookings || [], places: cached?.places || [], expenses: cached?.expenses || [], packing: cached?.packing || [],
  mode: "connecting", fromCache: !!cached
};
let db = null;
const COLS = ["bookings","places","expenses","packing"];
let saveTimer = null;
function persistCache(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => lsSet(CACHE_KEY, {meta:S.meta, bookings:S.bookings, places:S.places, expenses:S.expenses, packing:S.packing}), 300); }

async function put(col, obj){
  if(!obj.id) obj.id = uid();
  const rec = JSON.parse(JSON.stringify(obj));
  const list = S[col]; const i = list.findIndex(x => x.id === rec.id);
  if(i >= 0) list[i] = rec; else list.push(rec);
  persistCache(); render();
  if(db){ try { const {id, ...body} = rec; await db.collection(col).doc(rec.id).set(body); } catch(e){ handleWriteErr(e); } }
}
async function del(col, id){
  S[col] = S[col].filter(x => x.id !== id); persistCache(); render();
  if(db){ try { await db.collection(col).doc(id).delete(); } catch(e){ handleWriteErr(e); } }
}
async function putMeta(m){
  S.meta = Object.assign({}, S.meta, m); persistCache(); render();
  if(db){ try { await db.doc("meta/trip").set(S.meta); } catch(e){ handleWriteErr(e); } }
}
function handleWriteErr(e){
  if(e && e.code === "quota_exceeded") toast("存储已满，请删除一些旧记录");
  else toast("这次修改没能同步，已保存在本机，稍后会重试显示");
  console.warn(e);
}

let rq = 0;
function renderSoon(){ if(rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
function setMode(m){ S.mode = m; renderSync(); }
async function connect(){
  let timer = setTimeout(() => { if(S.mode === "connecting") setMode("slow"); }, 10000);
  try { db = window.__fbdb || null; } catch(e){ db = null; }
  if(!db){ clearTimeout(timer); setMode("local"); return; }
  let pending = new Set(["meta", ...COLS]);
  const settle = (k, snap) => { if(!snap.metadata.fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); setMode("synced"); } } };
  const onErr = e => { clearTimeout(timer); console.warn(e); setMode("error"); };
  db.doc("meta/trip").onSnapshot(snap => {
    if(snap.exists) S.meta = Object.assign({}, DEFAULT_META, snap.data());
    persistCache(); renderSoon(); settle("meta", snap);
  }, onErr);
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      persistCache(); renderSoon(); settle(col, snap);
    }, onErr);
  });
}

/* ---------- derived ---------- */
function tripDays(){
  const s = parseDate(S.meta.start), e = parseDate(S.meta.end);
  const maxPlaceDay = Math.max(0, ...S.places.map(p => Number(p.day) || 0));
  let n = (s && e) ? dayDiff(s, e) + 1 : 0;
  n = Math.max(n, maxPlaceDay, 1);
  if(n > 60) n = 60;
  const out = [];
  for(let i = 1; i <= n; i++){ const d = s ? new Date(s.getFullYear(), s.getMonth(), s.getDate() + i - 1) : null; out.push({n:i, date:d}); }
  return out;
}
function dayOfDate(str){ const s = parseDate(S.meta.start), d = parseDate(str); if(!s || !d) return 0; return dayDiff(s, d) + 1; }
function hotelForNight(date){
  if(!date) return null; const iso = isoDate(date);
  return S.bookings.find(b => b.type === "hotel" && b.start && b.end && b.start.slice(0,10) <= iso && b.end.slice(0,10) > iso) || null;
}
function toNZD(a, cur){ a = Number(a) || 0; const r = Number(S.meta.rate) || 0.77; return cur === "SGD" ? a / r : a; }
function toSGD(a, cur){ a = Number(a) || 0; const r = Number(S.meta.rate) || 0.77; return cur === "SGD" ? a : a * r; }
function sortPlaces(list){ return list.slice().sort((a,b) => (a.time || "99").localeCompare(b.time || "99") || (Number(a.order)||0) - (Number(b.order)||0)); }
const hasExamples = () => [...S.bookings, ...S.places, ...S.expenses].some(x => x.example);

const VIEWS = [["trip","行程","trip"],["bookings","预订","book"],["map","地图","map"],["budget","预算","money"],["packing","打包","bag"],["info","资讯","info"]];
let view = (location.hash || "").slice(1); if(!VIEWS.some(v => v[0] === view)) view = "trip";
function renderNav(){
  const btns = VIEWS.map(([k,l,ic]) => `<button class="navbtn" data-go="${k}" ${k===view?'aria-current="page"':''}>${I[ic]}<span>${l}</span></button>`).join("");
  $("#sidenav").innerHTML = `<div class="brand">${I.fern}<span>旅行手帐</span></div>${btns}<div class="spacer"></div><div class="sync" id="sync1"></div><button class="navbtn" data-act="settings" title="设置与备份" aria-label="设置与备份">${I.gear}</button>`;
  $("#bottomnav").innerHTML = btns;
  renderSync();
}
function renderSync(){
  const m = {connecting:["","正在连接…"], slow:["warn","暂时连不上，显示上次的数据"], synced:["ok","已同步，电脑和手机通用"], local:["warn","仅保存在这台设备"], error:["warn","同步中断，刷新页面重试"]}[S.mode];
  const html = `<span class="dot ${m[0]}"></span><span>${m[1]}</span>`;
  const a = $("#sync1"); if(a) a.innerHTML = html;
  const b = $("#sync2"); if(b) b.innerHTML = html;
}
function go(k){ view = k; try { history.replaceState(null, "", "#" + k); } catch(e){ location.hash = k; } renderNav(); render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if(VIEWS.some(v => v[0] === k) && k !== view){ view = k; renderNav(); render(); } });

const LAT0 = -41 * Math.PI / 180, KX = Math.cos(LAT0) * 100, KY = 100;

function mapPoints(){
  const pts = [];
  S.places.forEach(p => { const c = coordsOf(p); if(c && (mapDay === "all" || Number(p.day) === Number(mapDay))) pts.push({kind:"place", o:p, c, day:Number(p.day)||0}); });

      const c = coordsOf(b); if(!c) return;
      const d = b.start ? dayOfDate(b.start) : 0;
      if(mapDay === "all" || (b.type === "hotel" && b.start && b.end && dayOfDate(b.start) <= Number(mapDay) && dayOfDate(b.end) >= Number(mapDay)) || (b.type !== "hotel" && d === Number(mapDay))) pts.push({kind:"booking", o:b, c, day:d});

function drawMap(resetView){

function bindMap(){
  const svg = $("#mapsvg"); if(!svg) return;
  const ptrs = new Map(); let start = null, moved = false;
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); const s = Math.max(vb[2] / r.width, vb[3] / r.height); const ox = (r.width - vb[2]/s)/2, oy = (r.height - vb[3]/s)/2; return [vb[0] + (cx - r.left - ox) * s, vb[1] + (cy - r.top - oy) * s, s]; };

      moved = true;
      const [a, b] = [...ptrs.values()]; const d1 = Math.hypot(a[0]-b[0], a[1]-b[1]);
      if(!start.d){ start.d = d1; start.vb = vb.slice(); start.c = [(a[0]+b[0])/2, (a[1]+b[1])/2]; return; }
      const f = start.d / d1; vb = start.vb.slice(); zoomAt(start.c[0], start.c[1], f);

}

  parallax();

  io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ en.target.classList.remove("pre"); io.unobserve(en.target); } }), {rootMargin:"0px 0px -8% 0px"});
  const vh = window.innerHeight;
  document.querySelectorAll("#view .day, #view .card, #view .stat, #view .bk, #view .darkcard, #view .sec-head, #view .banner").forEach(el => {
    if(el.getBoundingClientRect().top > vh * 0.92){ el.classList.add("reveal", "pre"); io.observe(el); }

    const t0 = performance.now(), dur = 1100;

    const final = el.innerHTML;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); if(k < 1){ el.textContent = show(Math.round(to * e)); requestAnimationFrame(step); } else el.innerHTML = final; };

let pTick = false;
function parallax(){

  const y = Math.max(0, window.scrollY), h = stage.offsetHeight || 1;
  if(y > h) return;

  if(r1) r1.style.transform = `translate3d(0,${(y * 0.18).toFixed(1)}px,0)`;

function openSheet(title, fieldsHTML, onSubmit, extraBtns){
  const layer = $("#layer");
  layer.innerHTML = `<div class="scrim"><form class="sheet" id="sheet"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button type="button" class="iconbtn" data-close aria-label="关闭">×</button></div><div class="form">${fieldsHTML}</div><div class="row" style="justify-content:space-between"><div class="row">${extraBtns || ""}</div><div class="row"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">保存</button></div></div></form></div>`;
  const close = () => { layer.innerHTML = ""; if(pendingRender){ pendingRender = false; render(); } };
  layer.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  layer.querySelector(".scrim").addEventListener("click", e => { if(e.target.classList.contains("scrim")) close(); });
  $("#sheet").addEventListener("submit", e => { e.preventDefault(); const fd = {}; layer.querySelectorAll("[name]").forEach(i => fd[i.name] = i.type === "checkbox" ? i.checked : i.value.trim()); if(onSubmit(fd, close) !== false) close(); });
  if(window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches) setTimeout(() => layer.querySelector("input,textarea")?.focus(), 30);
  return layer;
}
const fld = (name, label, val, opts = {}) => {
  const full = opts.full ? " full" : ""; const id = "f-" + name;
  if(opts.options) return `<div class="f${full}"><label for="${id}">${label}</label><select id="${id}" name="${name}">${opts.options.map(([v,l]) => `<option value="${esc(v)}" ${String(v)===String(val??"")?"selected":""}>${esc(l)}</option>`).join("")}</select></div>`;
  if(opts.textarea) return `<div class="f${full}"><label for="${id}">${label}</label><textarea id="${id}" name="${name}" placeholder="${esc(opts.ph||"")}">${esc(val)}</textarea></div>`;
  return `<div class="f${full}"><label for="${id}">${label}</label><input id="${id}" name="${name}" type="${opts.type||"text"}" value="${esc(val)}" placeholder="${esc(opts.ph||"")}" ${opts.list?`list="${opts.list}"`:""} ${opts.step?`step="${opts.step}"`:""} ${opts.mode?`inputmode="${opts.mode}"`:""}></div>`;
};

function locFields(o, nameField){

function bindGeo(layer, nameSel){
  const nameI = layer.querySelector(nameSel), coordI = layer.querySelector("#f-coords"), hint = layer.querySelector("#geo-hint");
  const fromRef = v => { const s = String(v||"").toLowerCase().trim(); if(!s) return null; return PLACES_REF.find(p => p[0].toLowerCase() === s) || PLACES_REF.find(p => p[0].toLowerCase().includes(s) || s.includes(p[0].split(" ")[0].toLowerCase())); };
  nameI?.addEventListener("change", () => { const m = fromRef(nameI.value); if(m && !coordI.value){ coordI.value = `${m[1]}, ${m[2]}`; hint.textContent = "已从常见地点填入大致坐标。"; hint.className = "hint"; } });
  layer.querySelector("#geo-btn").onclick = async () => {
    const v = nameI.value.trim(); if(!v){ hint.textContent = "先填地点名称。"; hint.className = "hint err"; return; }
    const m = fromRef(v); if(m){ coordI.value = `${m[1]}, ${m[2]}`; hint.textContent = "已从常见地点填入大致坐标。"; hint.className = "hint"; return; }
    hint.textContent = "正在查找…"; hint.className = "hint";
    try { const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nz&accept-language=zh,en&q=" + encodeURIComponent(v)).then(r => r.json());
      if(r && r[0]){ coordI.value = `${Number(r[0].lat).toFixed(4)}, ${Number(r[0].lon).toFixed(4)}`; hint.textContent = `找到：${String(r[0].display_name || "").split(",").slice(0,2).join(",")}（大致位置，可在地图上核对）`; return; }
    } catch(e){}
    const sample = null;
    if(!sample){ hint.textContent = "这里没法自动查找。请在 Google 地图长按该地点，复制坐标粘贴进来。"; hint.className = "hint err"; return; }
    hint.textContent = "正在请 Claude 查找…"; hint.className = "hint";
    try {
      const res = await sample.json(`Return ONLY a JSON object {"lat": number, "lng": number, "name": string} with the approximate coordinates of this place in New Zealand (name = its English name). If you are not confident it is a real place in New Zealand, return {"lat": null, "lng": null, "name": ""}.\nPlace: ${v}`, {modelTier:"quick"});
      if(res && typeof res.lat === "number" && typeof res.lng === "number" && res.lat < -33 && res.lat > -48 && res.lng > 165 && res.lng < 179.5){ coordI.value = `${res.lat.toFixed(4)}, ${res.lng.toFixed(4)}`; hint.textContent = `找到：${String(res.name||"").slice(0,60)}（大致位置，可在地图上核对）`; }
      else { hint.textContent = "没找到这个地点。换个写法，或从 Google 地图复制坐标。"; hint.className = "hint err"; }
    } catch(e){ hint.textContent = e && e.code === "not_granted" ? "没有授权 Claude 查找。可以从 Google 地图复制坐标粘贴进来。" : "查找失败，请稍后再试或手动粘贴坐标。"; hint.className = "hint err"; }
  };
}
function parseCoords(s){
  s = String(s || ""); if(!s.trim()) return {lat:"", lng:""};
  let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/(-?\d{1,2}\.\d+)\s*[,，\s]\s*(-?\d{2,3}\.\d+)/);
  if(!m) return null; const lat = Number(m[1]), lng = Number(m[2]);
  if(!(lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180)) return null;
  return {lat, lng};
}

document.addEventListener("click", async e => {
  const link = e.target.closest("a[href]");
  if(link && !link.dataset.act && link.getAttribute("href") !== "#") return;
  const t = e.target.closest("[data-go],[data-act],[data-copy],[data-bkf],[data-mapday],[data-zoom],[data-pick]");
  if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.copy != null){ e.preventDefault(); const v = t.dataset.copy; navigator.clipboard.writeText(v).then(() => toast("已复制 " + v), () => toast("复制失败，请长按选择")); return; }
  if(t.dataset.bkf){ bkFilter = t.dataset.bkf; render(); return; }
  if(t.dataset.mapday){ mapDay = t.dataset.mapday; mapSel = null; vb = null; render(); return; }
  if(t.dataset.zoom){ const svg = $("#mapsvg"); const r = svg.getBoundingClientRect();
    if(t.dataset.zoom === "fit"){ vb = null; drawMap(true); return; }
    const f = t.dataset.zoom === "in" ? 1/1.6 : 1.6; const cx = vb[0] + vb[2]/2, cy = vb[1] + vb[3]/2; vb = [cx - vb[2]*f/2, cy - vb[3]*f/2, vb[2]*f, vb[3]*f]; drawMap(false); return; }
  if(t.dataset.pick != null){ const p = $("#mapsvg")._pts[Number(t.dataset.pick)]; mapSel = {kind:p.kind, id:p.o.id}; const [x,y] = proj(...p.c); const w = Math.min(vb[2], 160), h = vb[3] * w / vb[2]; vb = [x - w/2, y - h/2, w, h]; drawMap(false); $("#mapbox").scrollIntoView({block:"nearest", behavior:"smooth"}); return; }
  const act = t.dataset.act; if(!act) return;
  e.preventDefault();
  const id = t.dataset.id;
  if(act === "settings") openSettings();
  else if(act === "add-place"){ editPlace(null); const d = Number(t.dataset.day)||0; const sel = $("#f-day"); if(sel) sel.value = String(d); }
  else if(act === "edit-place") editPlace(S.places.find(p => p.id === id));
  else if(act === "toggle-done"){ const p = S.places.find(p => p.id === id); if(p) put("places", {...p, done: !p.done}); }
  else if(act === "add-booking") editBooking(null);
  else if(act === "edit-booking") editBooking(S.bookings.find(b => b.id === id));
  else if(act === "add-expense") editExpense(null);
  else if(act === "edit-expense") editExpense(S.expenses.find(x => x.id === id));
  else if(act === "day-theme"){
    const n = t.dataset.day; const cur = (S.meta.dayTitles || {})[n] || "";
    openSheet(`第 ${n} 天的主题`, fld("theme","一句话说明这天做什么",cur,{full:true, ph:"例如 前往蒂卡波，看星空"}), fd => { const dt = Object.assign({}, S.meta.dayTitles || {}); if(fd.theme) dt[n] = fd.theme; else delete dt[n]; putMeta({dayTitles:dt}); });
  }
  else if(act === "map-day"){ mapDay = t.dataset.day; mapSel = null; vb = null; go("map"); }
  else if(act === "del-pack") del("packing", id);
  else if(act === "reset-pack"){ for(const p of S.packing.filter(p => p.checked)) await put("packing", {...p, checked:false}); }
  else if(act === "clear-examples"){
    if(!t.dataset.armed){ t.dataset.armed = "1"; t.textContent = "确定清除？再点一次"; return; }
    for(const col of ["bookings","places","expenses"]) for(const x of S[col].filter(x => x.example)) await del(col, x.id);
    const m = Object.assign({}, S.meta); if(m.exampleMeta){ await putMeta({name:"新西兰自驾", start:"", end:"", dayTitles:{}, exampleMeta:false}); }
    toast("示例已清除，开始填你自己的行程吧");
  }
});

});
let LMAP_BASE = "街道";
function drawMap(resetView){
  const box = $("#mapbox"); if(!box || typeof L === "undefined") return;

  if(!LM || LM.getContainer() !== el){

    const layers = LMAP_LAYERS(); layers[LMAP_BASE].addTo(LM);
    L.control.layers(layers, null, {position: "topright", collapsed: false}).addTo(LM);
